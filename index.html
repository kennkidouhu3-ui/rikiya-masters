<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="googlebot" content="noindex,nofollow">
<title>カードバトル練習場</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#e9e5d8;--panel:#f7f4ea;--panel2:#ddd8c6;--ink:#1d2a2b;--muted:#5d6a68;--line:#bfb9a3;
  --accent:#a8741a;--btn:#1f6f6a;--btnink:#fff;--danger:#b8402b;--ok:#2d8a4e;
  --cw:60px;--ch:84px;--mw:34px;--mh:48px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1c1d;--panel:#16292a;--panel2:#1d3638;--ink:#eee9d9;--muted:#9fb0ac;--line:#2d4a4c;--accent:#e0b04f;--btn:#e0b04f;--btnink:#1a1a12;--danger:#ee7f69;--ok:#6fcf8d;}
}
:root[data-theme="dark"]{--bg:#0f1c1d;--panel:#16292a;--panel2:#1d3638;--ink:#eee9d9;--muted:#9fb0ac;--line:#2d4a4c;--accent:#e0b04f;--btn:#e0b04f;--btnink:#1a1a12;--danger:#ee7f69;--ok:#6fcf8d;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-tap-highlight-color:transparent}
#app{max-width:980px;margin:0 auto;padding:0 8px 24px}
button{font:inherit;color:var(--ink);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;min-height:38px}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--btn);color:var(--btnink);border-color:transparent;font-weight:700}
button.ghost{background:transparent}
button:disabled{opacity:.4;cursor:default}
button.lnk{background:none;border:none;color:var(--accent);padding:0 2px;min-height:0;text-decoration:underline;font-size:13px}
button.big{font-size:18px;padding:14px 22px;margin-top:6px}

.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg);padding:8px 0 4px;border-bottom:1px solid var(--line)}
.turn b{font-size:16px;margin-right:8px}.turn span{color:var(--muted)}
.btns{display:flex;gap:6px}
.msg{min-height:42px;padding:6px 2px;color:var(--ink)}
.msg em{display:block;font-style:normal;color:var(--muted);font-size:12px}

.zone{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 8px 10px;margin:6px 0}
.zone.mine{border-color:var(--accent)}
.zinfo{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.zinfo span{color:var(--muted);font-size:13px}
.lbl{font-size:12px;color:var(--muted);margin:6px 0 2px}
.pair{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.pair .grow{flex:1 1 200px;min-width:0}
.mid{height:2px}

.row{display:flex;gap:6px;overflow-x:auto;padding:4px 2px;min-height:calc(var(--h) + 10px);--w:var(--cw);--h:var(--ch);align-items:center}
.row.mini{--w:var(--mw);--h:var(--mh);gap:4px}
.row.bz{min-height:calc(var(--ch) + 14px)}
.card{position:relative;flex:0 0 auto;width:var(--w);height:var(--h);cursor:pointer;transition:transform .15s}
.card img{display:block;width:100%;height:100%;object-fit:cover;border-radius:5px;border:2px solid var(--civ,#888);background:#222}
.card.tp{transform:rotate(90deg);margin:0 calc((var(--h) - var(--w))/2)}
.card.ok img{box-shadow:0 0 0 2px var(--ok)}
.card.back{cursor:default;border-radius:5px;border:2px solid #8a94c8;background:repeating-linear-gradient(45deg,#26305a 0 6px,#303c70 6px 12px);display:flex;align-items:center;justify-content:center;color:#cfd6ff;font-weight:700;font-size:11px}
.zz{position:absolute;right:-2px;top:-4px;font-style:normal;font-size:14px}
.empty{color:var(--muted);font-size:12px;padding:6px 4px}

.ov{position:fixed;left:0;right:0;top:0;bottom:0;z-index:20;background:rgba(8,14,15,.72);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px));overflow:auto}
.ov.top{z-index:30}
.sheet{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;width:100%;max-width:420px;max-height:100%;overflow:auto}
.sheet.center{text-align:center}
.sheet h2{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-size:34px;margin:6px 0;font-weight:400}
.sheet img.big{display:block;margin:0 auto 8px;max-width:100%;max-height:56vh;border-radius:10px}
.sheet img.big.sm{max-height:30vh}
.spec{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}.spec span{color:var(--muted);font-size:13px}
.impl{font-size:13px;background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.warn{color:var(--danger);font-size:13px;margin:4px 0}
.acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.mt{font-weight:700;margin-bottom:8px}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;width:100%}
.opt img{width:36px;height:50px;object-fit:cover;border-radius:4px;flex:0 0 auto}
.msg2{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}
.msc{position:relative;width:60px;height:84px;padding:0;border:none;background:none;border-radius:6px;min-height:0}
.msc img{display:block;width:100%;height:100%;object-fit:cover;border-radius:5px;border:2px solid var(--civ);opacity:.75}
.msc.on img{opacity:1;box-shadow:0 0 0 3px var(--accent);transform:translateY(-4px)}
.msc.on::after{content:"✓";position:absolute;right:2px;top:2px;background:var(--accent);color:var(--btnink);border-radius:50%;width:20px;height:20px;line-height:20px;font-size:13px;font-weight:700;text-align:center}
.hint{color:var(--muted);font-size:13px;margin:0 0 4px}
.seg{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:6px 0 10px}
.seg button.on{background:var(--btn);color:var(--btnink);border-color:transparent;font-weight:700}
.stk{position:absolute;left:1px;bottom:1px;background:var(--accent);color:var(--btnink);font-size:10px;font-style:normal;border-radius:8px;padding:0 4px;line-height:15px}
.now{font-size:13px;color:var(--accent);margin-bottom:6px}
.online{margin:18px auto 6px;max-width:460px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-align:left}
.online .seg{margin:8px 0}
.join{display:flex;gap:8px;margin:8px 0}
.join input{flex:1;min-width:0;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);letter-spacing:.2em;text-transform:uppercase}
.code{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-size:clamp(40px,14vw,76px);letter-spacing:.18em;margin:10px 0;color:var(--accent)}
.gv{display:flex;flex-wrap:wrap;gap:6px;--w:56px;--h:78px}
.logbox{max-height:60vh;overflow:auto;font-size:13px}.logbox div{padding:3px 0;border-bottom:1px dashed var(--line)}
.rules p{margin:0 0 8px;font-size:13px}

.title{padding:28px 4px 8px;text-align:center}
.title h1{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400;font-size:clamp(30px,8vw,52px);margin:0 0 6px;letter-spacing:.02em}
.sub{color:var(--muted);margin:0 0 14px}
.note{color:var(--muted);font-size:13px;margin:12px 0}
.catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:14px 0}
.cat{cursor:pointer;font-size:11px;line-height:1.3}
.cat img{width:100%;aspect-ratio:1300/1816;object-fit:cover;border-radius:6px;display:block;margin-bottom:3px}

@media (min-width:700px){:root{--cw:84px;--ch:117px;--mw:42px;--mh:59px}}
@media (min-width:1000px){:root{--cw:96px;--ch:134px;--mw:46px;--mh:64px}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}

/* ---- 文字だけのカード ---- */
.card{border-radius:6px;background:var(--g,#888);border:2px solid var(--civ,#888);padding:2px;color:#111;overflow:hidden}
.card .cf{position:absolute;inset:2px;background:rgba(255,255,255,.88);border-radius:4px;display:flex;flex-direction:column;align-items:stretch;justify-content:space-between;padding:2px 3px;text-align:left}
.card .cs{position:absolute;left:-1px;top:-1px;min-width:18px;height:18px;line-height:18px;text-align:center;background:#222;color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:4px 0 6px 0;padding:0 3px}
.card .nm{display:block;margin-top:16px;font-size:10px;line-height:1.15;font-weight:700;word-break:break-all;max-height:5.6em;overflow:hidden}
.card .pw{display:block;font-size:11px;font-weight:700;text-align:right;color:#333}
.card .pw.sp{font-size:9px;font-weight:500;color:#555;word-break:break-all}
.card.ok{box-shadow:0 0 0 2px var(--ok)}
.card.back{border:2px solid #8a94c8;background:repeating-linear-gradient(45deg,#26305a 0 6px,#303c70 6px 12px);display:flex;align-items:center;justify-content:center;color:#cfd6ff;font-weight:700;font-size:10px}
.row.mini .card .nm,.row.mini .card .pw{display:none}
.row.mini .card .cs{position:static;margin:auto;font-size:12px}
.row.mini .card .cf{align-items:center;justify-content:center;padding:0}
.stk,.exb,.pil,.dvb,.lkb{position:absolute;font-size:10px;line-height:14px;padding:0 3px;border-radius:7px;background:#222;color:#fff;font-style:normal}
.stk{left:2px;bottom:2px}.exb{right:2px;bottom:2px;background:#b8402b}.pil{left:2px;bottom:16px;background:#5a3a8a}.dvb{right:2px;top:2px;background:#2f9be0}.lkb{right:2px;top:2px;background:transparent}
.catalog{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
.cat{position:relative;padding:6px 6px 6px 26px;border-radius:8px;background:var(--g);border:2px solid var(--civ);color:#111;min-height:54px;display:flex;align-items:center;text-align:left;font-size:11px;line-height:1.3}
.cat span{background:rgba(255,255,255,.85);border-radius:4px;padding:2px 4px;display:block;width:100%}
.cat i{position:absolute;left:3px;top:3px;min-width:18px;height:18px;line-height:18px;text-align:center;background:#222;color:#fff;font-style:normal;font-size:11px;font-weight:700;border-radius:4px;padding:0 3px}
.bigcard{border-radius:12px;border:3px solid var(--civ);background:var(--g);padding:6px;margin-bottom:8px;color:#111}
.bigcard .bh,.bigcard .bm,.bigcard .bk{background:rgba(255,255,255,.88);border-radius:6px;padding:4px 8px;margin-bottom:3px}
.bigcard .bh{display:flex;align-items:center;gap:8px;font-size:16px}
.bigcard .bm{font-size:12px;color:#333}.bigcard .bk{font-size:12px;font-weight:700;color:#7a2a10}
.bigcard .cs{min-width:26px;height:26px;line-height:26px;text-align:center;background:#222;color:#fff;font-style:normal;font-weight:700;border-radius:6px;padding:0 4px;flex:0 0 auto}
.impl p{margin:0 0 6px}.impl p:last-child{margin:0}
.twin{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line)}.twin b{display:block}.twin span{display:block;color:var(--muted);font-size:12px;margin-bottom:3px}
.now{font-size:13px;margin:0 0 6px;color:var(--muted)}
.mini2{position:relative;width:34px;height:34px;flex:0 0 auto;border-radius:6px;background:var(--g);border:2px solid var(--civ);display:flex;align-items:center;justify-content:center}
.mini2 i{font-style:normal;font-weight:700;font-size:13px;background:rgba(255,255,255,.88);border-radius:4px;padding:0 4px;color:#111}
.msc{width:74px;height:72px;border:2px solid var(--civ);background:var(--g);opacity:.7;border-radius:8px;position:relative}
.msc.on{opacity:1;box-shadow:0 0 0 3px var(--accent);transform:translateY(-4px)}
.msc .cf{position:absolute;inset:2px;background:rgba(255,255,255,.88);border-radius:5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px;color:#111}
.msc .cs{font-style:normal;font-weight:700;background:#222;color:#fff;border-radius:4px;padding:0 5px;font-size:12px}
.msc .nm{font-size:9px;line-height:1.1;word-break:break-all;max-height:3.4em;overflow:hidden}
.code{font-family:"Dela Gothic One",sans-serif;font-size:44px;letter-spacing:.2em;margin:10px 0}
.online{margin:18px 0;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.join{display:flex;gap:6px;justify-content:center;margin:6px 0}
.join input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:150px;text-transform:uppercase;text-align:center;letter-spacing:.1em}
.gv .card{width:56px;height:78px}
.btns button{white-space:nowrap;padding:6px 9px;min-height:34px}
.turn span{white-space:nowrap}
.deckbox{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.deckhd{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.deckhd b{font-size:20px}
.dlist{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.drow{display:flex;align-items:center;gap:8px;border:2px solid var(--civ);background:var(--g);border-radius:8px;padding:4px;opacity:.7}
.drow.in{opacity:1}
.drow .dn{flex:1;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.88);color:#111;border:none;text-align:left;padding:4px 6px;min-height:36px}
.drow .dn i{font-style:normal;font-weight:700;background:#222;color:#fff;border-radius:4px;padding:0 6px;min-width:22px;text-align:center}
.drow .dn span{font-size:13px;line-height:1.25}
.dc{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.88);border-radius:6px;padding:2px 4px;color:#111}
.dc button{min-height:34px;width:34px;padding:0;font-size:18px}
.dc b{min-width:18px;text-align:center}
/* タマシード・表向きシールド・山札の上 */
.card.ts{border-style:dashed!important;opacity:.95}
.card.ts .pw.sp{color:#2d6a8a}
.card.up{outline:2px solid #f3c64a;outline-offset:-2px}
.card.back.exs span{color:#f3c64a}
.peek{margin-top:6px}
.deckhd.presets{flex-wrap:wrap;gap:6px;font-size:13px}
.deckhd.presets span{opacity:.75}
.dfil{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.dfil button{padding:4px 10px;border-radius:999px;font-size:13px}
.dfil button.on{background:#2b2f3a;color:#fff}
/* ===== デッキ編集（新） ===== */
.deckscr{max-width:900px;margin:0 auto}
.dhead{position:sticky;top:0;z-index:6;background:var(--bg);padding:8px 0 6px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;text-align:left}
.dcount{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.dcount b{font-size:26px;line-height:1}
.dcount span{color:var(--muted)}
.dbar{flex-basis:100%;height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:4px}
.dbar i{display:block;height:100%;border-radius:99px}
.dmsg{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.dtabs{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.dtabs button.on{background:var(--btn);color:var(--btnink);border-color:var(--btn);font-weight:700}
.dfbox{display:flex;flex-direction:column;gap:6px;margin:10px 0;text-align:left}
.dq{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);width:100%;box-sizing:border-box}
.dfrow,.dsorts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.dfrow span,.dsorts span{flex:none;font-size:12px;color:var(--muted);min-width:44px}
.dfrow button,.dsorts button{flex:none;padding:4px 12px;min-height:32px;border-radius:999px;font-size:13px}
.dfrow button.on,.dsorts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dfrow .civb{border:2px solid var(--civ)}
.dfrow .civb.on{background:var(--civ);border-color:var(--civ);color:#fff}
.dhit{text-align:left;margin:4px 0}
.dcat{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px;padding-bottom:4px;border-bottom:2px solid var(--line);font-size:16px;text-align:left}
.dcat span{font-size:12px;font-weight:400;color:var(--muted)}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
@media(min-width:560px){.dgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:820px){.dgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.dt{border:2px solid var(--civ);background:var(--g);border-radius:10px;padding:3px;display:flex;flex-direction:column;gap:3px;opacity:.82}
.dt.in{opacity:1;box-shadow:0 0 0 2px var(--ok)}
.dtf{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:rgba(255,255,255,.9);color:#111;border:none;border-radius:7px;padding:24px 8px 6px;min-height:78px}
.dtf .cs{position:absolute;left:0;top:0;min-width:24px;height:22px;line-height:22px;text-align:center;background:#222;color:#fff;font-style:normal;font-weight:700;border-radius:7px 0 8px 0;font-size:13px;padding:0 4px}
.dtf .dcnt{position:absolute;right:4px;top:3px;background:var(--ok);color:#fff;border-radius:999px;padding:0 8px;font-size:13px}
.dtf .dn{font-weight:700;font-size:13px;line-height:1.3;word-break:break-all}
.dtf .dty{font-size:11px;color:#555}
.dtf .dty em{font-style:normal;background:#e3b92f;color:#222;border-radius:4px;padding:0 4px;font-weight:700}
.dtb{display:grid;grid-template-columns:44px 1fr 44px;gap:3px}
.dtb button{min-height:34px;padding:0;background:rgba(255,255,255,.88);color:#111;border:none;border-radius:6px;font-size:18px;font-weight:700}
.dtb .dinfo{font-size:12px;font-weight:500}
.dtb button:disabled{opacity:.35}
.dstat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;text-align:left}
.curve{display:flex;align-items:flex-end;gap:6px;height:100px}
.cb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.cbb{width:100%;max-width:34px;background:var(--btn);border-radius:4px 4px 0 0;min-height:2px}
.cbn{font-size:11px;color:var(--muted)}
.cbl{font-size:12px;font-weight:700;margin-top:2px}
.dsum,.dciv{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:13px}
.cvc{border-left:4px solid var(--civ);padding-left:6px}
.drow .dn small{display:block;font-size:11px;color:#555}
.dpre{margin:16px 0 30px;text-align:left}
.dpre>div{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.dpre button{font-size:13px}
.dclr{color:var(--danger)}
/* 複数デッキ */
.deckbox2{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0;text-align:left}
.dbt{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dchip{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:6px 12px;border-radius:10px;min-height:44px;text-align:left}
.dchip b{font-size:14px;line-height:1.2}
.dchip small{font-size:11px;color:var(--muted)}
.dchip.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.dchip.on small{color:inherit;opacity:.85}
.dchip.add{justify-content:center;border-style:dashed}
.dbrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:flex-end;margin-top:8px}

.row.bz:has(> .empty:only-child){min-height:0}

<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const INF=Infinity;
/* ===== カードデータ（26EX4 33種 ＋ GRゾーン用の仮カード） =====
   効果の文章は、プレイ中に読みやすいように要約したものです。 */
const KWL={exLife:'EXライフ',sa:'スピードアタッカー',wbreaker:'W・ブレイカー',tbreaker:'T・ブレイカー',worldBreaker:'ワールド・ブレイカー',blocker:'ブロッカー',mach:'マッハファイター',gstrike:'G・ストライク',justDiver:'ジャストダイバー',eternal:'エターナル・Ω'};
const DEFS={};

/* ---- 呪文 ---- */
DEFS.c1={name:'ジョジョジョ・マキシマム',civ:['無'],cost:9,type:'s',race:['ジョーカーズ'],
  freeIf:pi=>jokerCount(pi)>=11,
  txt:['G・ゼロ：自分のジョーカーズ（バトルゾーン）と、マナゾーンのジョーカーズ・カードが合計11以上なら、コストを支払わずに唱えてもよい。',
       '自分のクリーチャーの数を数える。このターン、自分のクリーチャー1体は、その数だけシールドを追加でブレイクする。そのクリーチャーが攻撃している間、相手は呪文を唱えられない。'],
  async onCast(pi){
    const P=G.p[pi];const n=P.bz.length;if(!n){log('自分のクリーチャーがいないため、効果なし');return;}
    const c=await choose(pi,`追加でブレイクさせるクリーチャーを選択（追加${n}枚）`,P.bz,strongPick);
    if(!c)return;c.extraBreak=(c.extraBreak||0)+n;c.noSpellDef=true;
    log(`『${nameOf(c)}』はこのターン、シールドを${n}枚追加でブレイクする`);
  }};

DEFS.c2={name:'勝熱と弾丸と自由の決断',civ:['無'],cost:4,type:'s',race:['ジョーカーズ'],
  freeIf:pi=>jokerCount(pi)>=7,
  txt:['G・ゼロ：自分のジョーカーズ（バトルゾーン）と、マナゾーンのジョーカーズ・カードが合計7以上なら、コストを支払わずに唱えてもよい。',
       '次の3つから、異なるものを2回選ぶ。',
       '▶バトルゾーンにあるコスト3以下のカードを1枚選び、持ち主の山札の下に置く。',
       '▶このターン、自分のクリーチャー1体は相手プレイヤーを攻撃できる（このゲームでは「プレイヤーを攻撃できない」クリーチャーがいないので、実質効果なし）。',
       '▶相手のクリーチャーを1体選ぶ。このターン、そのクリーチャーの能力を無視する。'],
  async onCast(pi){
    const opts=[
      {label:'コスト3以下のカードを山札の下に置く',value:1},
      {label:'自分のクリーチャー1体が、相手プレイヤーを攻撃できる',value:2},
      {label:'相手のクリーチャー1体の能力を、このターン無視する',value:3}];
    let picked=[];
    for(let k=0;k<2;k++){
      const rest=opts.filter(o=>!picked.includes(o.value));
      let v;
      if(G.p[pi].cpu){
        const cand1=allBZ().filter(x=>D(x).cost<=3&&(x.owner===pi?false:!x.dive));
        const pri=[1,3,2].filter(m=>rest.some(o=>o.value===m)&&(m!==1||cand1.length)&&(m!==3||targetable(pi).length));
        v=pri.length?pri[0]:rest[0].value;
      }else v=await ask(pi,`モードを選択（${k+1}/2回目）`,rest);
      if(v===undefined)return;
      picked.push(v);
      if(v===1){
        const L=allBZ().filter(x=>D(x).cost<=3&&(x.owner===pi||!x.dive));
        const t=await choose(pi,'山札の下に置くカードを選択（コスト3以下）',L,l=>{const o=l.filter(x=>x.owner!==pi);return (o.length?o:l).sort((a,b)=>cmp(D(b).cost,D(a).cost))[0];});
        if(t){log(`『${nameOf(t)}』は持ち主の山札の下に置かれた`);await leaveBZ(t.owner,t,'deckBottom');}
        else log('対象がいないため、効果なし');
      }else if(v===2){log('（効果なし：このゲームには「プレイヤーを攻撃できない」制限がありません）');}
      else{
        const t=await choose(pi,'能力を無視する相手のクリーチャーを選択',targetable(pi),strongPick);
        if(t){t.ignoreT=true;log(`『${nameOf(t)}』の能力は、このターン無視される`);}
        else log('対象がいないため、効果なし');
      }
    }
  }};

DEFS.c4={name:'DREAMの逆転撃',civ:['光','火','自然'],cost:7,type:'s',race:[],
  ignoreSpellBan:true,gyaku:5,
  txt:['この呪文を唱えられなくする効果を無視する。',
       '逆転撃⑤：相手のクリーチャーが自分（プレイヤーやシールド）を攻撃する時、その攻撃中にまだ「逆転撃」を使っていなければ、この呪文を手札からコストを支払わずに唱えてもよい。そうしたら、次の自分のターンのはじめにマナ5枚をタップして支払う。払えなければ、自分はゲームに負ける。',
       '自分の超次元ゾーンから、コスト7以下のエレメントを1つ出してもよい。その後、自分と相手のクリーチャーを1体ずつ選んでもよい。その2体をバトルさせる。'],
  async onCast(pi){
    const P=G.p[pi];
    const H=P.hyper.filter(x=>cc(x)<=7&&(DEFS[x.id].type==='t'||nonEvo(x))&&!putBlocked(pi,x));
    const hx=await choose(pi,'超次元ゾーンから出すコスト7以下のエレメント',H,bigPick,true);
    if(hx){zoneRemove(pi,hx,'hyper');await putOnBZ(pi,plain(hx),{summon:false});if(G.over)return;}
    if(!P.bz.length||!targetable(pi).length)return;
    const mine=await choose(pi,'バトルさせる自分のクリーチャーを選択',P.bz,strongPick,true);
    if(!mine)return;
    const opp=await choose(pi,'バトルさせる相手のクリーチャーを選択',targetable(pi),weakPick,true);
    if(!opp)return;
    await battle(pi,mine,1-pi,opp);
  }};

/* ---- クリーチャー ---- */
DEFS.c3={name:'切札連融王 Dol-Fal-20th',civ:['光','闇','火','自然'],cost:17,power:87654,type:'c',
  race:['ディスペクター','エンジェル・コマンド','デーモン・コマンド','アーマード・ドラゴン','禁断'],
  kw:['exLife','sa','worldBreaker'],
  spellBan:(x,pi)=>G.cur===x.owner,
  txt:['自分のターン中、相手は呪文を唱えられない。',
       'このクリーチャーが攻撃する時、クリーチャーをすべて破壊する。',
       'クリーチャーが破壊された時、自分はカードを1枚引いてもよい。',
       '自分がカードを引いた時、相手のマナゾーンのカードを1枚選び、タップする。次の自分のターンのはじめまで、それはアンタップしない。'],
  async onAttack(pi,c){
    log('Dol-Fal-20th：クリーチャーをすべて破壊する！');
    await massDestroy([...G.p[pi].bz.map(x=>[pi,x]),...G.p[1-pi].bz.map(x=>[1-pi,x])]);
  },
  async onAnyDestroyed(pi,c){
    const yes=await askYN(pi,'Dol-Fal-20th：カードを1枚引きますか？',c,true);
    if(yes)await draw(pi,1);
  },
  async onDraw(pi,c){
    const O=G.p[1-pi];
    const un=O.mana.filter(m=>!m.tapped&&m.lock===undefined);
    const list=un.length?un:O.mana.filter(m=>m.lock===undefined);
    if(!list.length)return;
    const m=await choose(pi,'タップする相手のマナを選択',list.map(x=>x.card),l=>l[0]);
    const ent=O.mana.find(x=>x.card===m)||O.mana.find(x=>x.card.uid===(m&&m.uid));
    if(ent){ent.tapped=true;ent.lock=pi;log(`相手のマナを1枚タップした（次の${G.p[pi].name}のターンのはじめまでアンタップしない）`);render();}
  }};

DEFS.c5={name:'切札電融 モモムゲン',civ:['火','水','自然'],cost:INF,power:INF,type:'c',
  race:['ディスペクター','∞マスター・ドラゴン','ヒーロー・ドラゴン','ジョーカーズ'],
  kw:['exLife','worldBreaker'],mugen:{n:5,cost:5},
  grant:{blocker:(x,c)=>c===x&&G.p[x.owner].bz.some(y=>y.tapped)},
  txt:['ムゲンクライム5：自分のクリーチャーを5体タップし、マナ5枚を支払って、このカードを手札または墓地から出してもよい。',
       '各ターン、はじめてこのクリーチャーが攻撃する時、アンタップする。',
       '自分のタップしているクリーチャーがあれば、このクリーチャーは「ブロッカー」を得る。',
       '多色ではないクリーチャーの能力と、呪文の効果を無視する（両プレイヤー共通）。'],
  async onAttack(pi,c){if(c.atkN===1){c.tapped=false;log('モモムゲンはアンタップした');}}};

DEFS.c6={name:'切札混成 ドギラダンテ刈',civ:['光','水','自然'],cost:8,power:13000,type:'c',
  race:['ディスペクター','メガ・コマンド・ドラゴン','エンジェル・コマンド・ドラゴン'],
  kw:['exLife','tbreaker'],
  rev:{test:a=>isMulti(a)&&D(a).cost>=5&&isDragon(a),label:'多色のコスト5以上のドラゴン'},
  grant:{sa:(x,c)=>isMulti(c)},
  txt:['革命チェンジ：多色のコスト5以上のドラゴン（攻撃する時、手札のこのカードと入れ替えられる）。',
       '自分の多色クリーチャーすべてに「スピードアタッカー」を与える。',
       'このクリーチャーが出た時、このターン、相手はコスト7以下のクリーチャーを出せない。',
       'ファイナル革命：「革命チェンジ」で出た時、そのターンにまだ他のファイナル革命を使っていなければ、カードを1枚引く。その後、コスト6以下の多色カードを1枚、自分の手札またはマナゾーンからコストを支払わずに実行してもよい。'],
  async onEnter(pi,c,ctx){
    G.noSmall[1-pi]=true;log('このターン、相手はコスト7以下のクリーチャーを出せない');
    if(ctx.rev&&!G.finalRev){
      G.finalRev=true;log('ファイナル革命！');
      await draw(pi,1);if(G.over)return;
      await freeMulti(pi,6);
    }
  }};

DEFS.c7={name:'鮫鰐竜 ACE-Agony',civ:['自然'],cost:10,power:15000,type:'c',race:['キング・コマンド・ドラゴン','オリジン'],

function pickCover(un,need,civs){
  if(un.length<need)return null;

    if(i===civs.length)return ch;
    const v=civs[i];
    if(ch.some(m=>mCiv(m).includes(v)))return dfs(i+1,ch);
    if(ch.length+1>need)return null;
    for(const m of un){
      if(ch.includes(m)||!mCiv(m).includes(v))continue;
      const r=dfs(i+1,[...ch,m]);if(r)return r;
    }
    return null;
  }
  const base=dfs(0,[]);if(!base)return null;
  const rest=un.filter(m=>!base.includes(m));
  const freq={};un.forEach(m=>mCiv(m).forEach(v=>freq[v]=(freq[v]||0)+1));
  rest.sort((a,b)=>{
    const sa=Math.min(...civOf(a.card).map(v=>freq[v])),sb=Math.min(...civOf(b.card).map(v=>freq[v]));
    return sb-sa;
  });
  return base.concat(rest.slice(0,need-base.length));
}

function costOf(pi,card,face,from,mod){
  const d=defOf(card,face);let c=d.cost;

  const P=G.p[pi];
  if(d.type==='c'&&face!=='s'){
    for(const x of P.bz){
      if(ignored(x))continue;
      if(x.id==='c21'&&(hasR(card,'ディスペクター')||hasR(card,'ディスタス')))c-=2;
      if(D(x).jokerDisc&&isJ(card))c-=D(x).jokerDisc;
      if(D(x).bigDisc&&d.cost!==INF&&d.cost>=10)c-=D(x).bigDisc;
    }
    for(const x of [...P.bz,...(P.ts||[])]){if(!ignored(x)&&D(x).allRed)c-=D(x).allRed(pi,card,x)||0;}
    if(d.costRed)c-=d.costRed(pi,card,from)||0;

    if(d.symp)sy=d.symp(pi)||0;

    else if(from==='hand'&&hasR(card,'生徒会組')&&P.bz.some(x=>D(x).grantDragonSymp&&!ignored(x)))sy=P.bz.filter(isDragon).length;
    let sMin=2;
    if(from==='hand'&&P.bz.some(x=>D(x).grantGale&&!ignored(x))){const g=2*P.bz.filter(x=>D(x).type==='c'&&pow(x)>=12000).length;if(g>sy){sy=g;sMin=1;}}
    if(d.sympMin)sMin=d.sympMin;

  }

  if(d.type==='c'&&face!=='s'&&(d.kw||[]).includes('blocker'))c-=P.shields.filter(s=>s.up&&DEFS[s.id].teetu).length;
  if(d.type==='t')for(const x of [...P.bz,...(P.ts||[])]){if(!ignored(x)&&D(x).tsRed)c-=D(x).tsRed(pi,card)||0;}
  c-=onceRed(pi,card,face).length;

  if(d.type==='c'&&face!=='s'&&hasR(card,'アーマード・ドラゴン'))P.bz.filter(x=>D(x).kaiserRupia&&!ignored(x)).forEach(()=>{c-=faceUp(pi)?2:1;});

}

  if(t.zone==='omega')return [...P.grave.filter(x=>DEFS[x.id].type==='c'),...P.mana.map(m=>m.card).filter(x=>DEFS[x.id].type==='c'&&x.uid!==card.uid),...P.bz].filter(x=>x.uid!==card.uid&&t.test(x));
  if(t.zone==='mana')return P.mana.map(m=>m.card).filter(x=>x.uid!==card.uid&&DEFS[x.id].type==='c'&&t.test(x));

function evoFeasible(pi,card){
  const d=D(card);
  if(!d.evo)return true;
  const pool=evoPool(pi,card);
  if(d.evo.kind==='sum'){let s=0;pool.forEach(x=>{s+=D(x).cost===INF?1000:D(x).cost;});return s>=d.evo.min;}
  if(d.evo.kind==='multiN')return pool.length>=d.evo.n;
  if(d.evo.kind==='omega'){const P=G.p[pi];return pool.some(x=>P.grave.includes(x))&&pool.some(x=>P.mana.some(m=>m.card===x))&&pool.some(x=>P.bz.includes(x));}
  return pool.length>0;
}
function freeOK(pi,card){
  const d=D(card);
  if(!d.freeIf||!d.freeIf(pi))return false;
  if(d.type==='s'&&spellBanned(pi,d))return false;
  if(d.type==='c'&&(putBlocked(pi,card)||!evoFeasible(pi,card)))return false;

/* 通常の支払いで実行できない理由（できるなら ''） */
function castReason(pi,card,face,from,mod){
  face=face||'c';from=from||'hand';
  const d=defOf(card,face);
  if(G.skipT&&G.skipT[pi]===G.turnNo)return 'ターンの残りがとばされました';
  if((d.type==='c'||d.type==='s')&&perfLocked(pi))return 'ペルフェクト：このターンはもう実行できません（3回まで）';
  if(d.type!=='c'&&d.cost!==INF&&d.cost<=5&&G.p[1-pi].bz.some(x=>D(x).ballLock&&!ignored(x)))return '超球の超人：コスト5以下のクリーチャーではないカードは実行できません';
  if(d.type==='s'&&spellBanned(pi,d))return '相手の効果で、呪文を唱えられません';
  if(d.type==='c'){
    if(putBlocked(pi,card))return '今は、そのクリーチャーを出せません';
    if(!evoFeasible(pi,card))return '進化元にできるクリーチャーがいません';
    const sl=summonLock(pi,card);if(sl)return sl;
  }
  let cost=costOf(pi,card,face,from,mod);
  if(cost===INF)return 'コストが∞のため、通常は出せません（ムゲンクライムなど）';
  const sp=sasaPool(pi,card,face);
  if(sp.length){const s=sp.reduce((a,x)=>a+sasaOf(x),0);cost=Math.max(1,cost-s);}
  const ex=from==='mana'?card.uid:null;
  return payReason(pi,cost,payCivs(pi,card,d),ex);
}
function mugenReason(pi,card,from){
  const d=D(card);if(!d.mugen)return '';
  if(from!=='hand'&&from!=='grave')return '手札か墓地から出します';
  if(putBlocked(pi,card))return '今は、そのクリーチャーを出せません';
  const ut=G.p[pi].bz.filter(x=>!x.tapped).length;
  if(ut<d.mugen.n)return `アンタップしているクリーチャーが${d.mugen.n}体必要です`;
  if(!canPay(pi,d.mugen.cost,civsOf(d)))return `マナ${d.mugen.cost}枚（${civsOf(d).join('・')}）を支払えません`;
  return '';
}
function joeN(pi,card){

}
function perfLocked(pi){return !!G&&(G.execN?G.execN[pi]:0)>=3&&G.p[1-pi].bz.some(x=>D(x).perfLock&&!ignored(x));}
function musukoOn(pi){return G.p[pi].bz.some(x=>D(x).grantJoe&&!ignored(x));}
function jetOn(pi){return G.cur===pi&&G.p[pi].bz.some(x=>D(x).jetMemo&&!ignored(x));}
function orochiOn(pi){return G.cur===pi&&G.p[pi].bz.some(x=>D(x).orochi&&!ignored(x));}

/* ===== 問い合わせ ===== */
function isRemote(pi){return NET.role==='host'&&!!G&&!!G.p[pi].remote;}
function ask(pi,title,options,opt={}){

      .then(r=>(r&&typeof r.idx==='number'&&options[r.idx])?options[r.idx].value:undefined);

}
async function askYN(pi,title,card,cpuDef){
  if(G.p[pi].cpu)return cpuDef===undefined?true:!!cpuDef;
  return ask(pi,title,[{label:'はい',value:true},{label:'いいえ',value:false}],{card});
}
async function choose(pi,title,cards,cpuPick,cancel){
  if(!cards||!cards.length)return null;
  let r;
  if(G.p[pi].cpu)r=cpuPick?cpuPick(cards):cards[0];
  else if(cards.length===1&&!cancel&&!isRemote(pi)){log(`（${title}：選択肢は1つ）`);r=cards[0];}
  else{
    const o=cards.map(c=>({card:c,label:lbl(c),value:c}));
    if(cancel)o.push({label:'やめる／選ばない',value:null});
    r=await ask(pi,title,o);
    if(r===undefined)r=null;
  }
  {const q=r?origChooser(pi,cards):null;
    if(q!==null&&cards.length>1){
      const own=cards.filter(c=>c.owner===q);
      if(G.p[q].cpu)r=weakPick(own.length?own:cards);
      else{const v=await ask(q,`ジ・オリジナル：相手のかわりに選ぶ（${title}）`,cards.map(c=>({card:c,label:lbl(c),value:c})));r=v||r;}
      log(`ジ・オリジナル：${G.p[q].name}がかわりに『${nameOf(r)}』を選んだ`);
    }}
  if(r&&r.owner!==undefined&&r.owner!==pi&&D(r).onChosen&&!ignored(r)&&inPlay(r.owner,r)&&!G.over)await D(r).onChosen(r.owner,r);
  return r;
}
async function pickMana(pi,card,need,civs,excludeUid){
  const un=untappedMana(pi,excludeUid);

  if(manaDouble(pi)){const n2=manaNeed(pi,need,civs);if(n2!==need)log(`レオパルズ・ホーン：マナの数字が2なので、カード${n2}枚でコスト${need}を支払える`);need=n2;}
  if(G.p[pi].cpu)return pickCover(un,need,civs);
  if(un.length===need&&civs.every(v=>un.some(m=>mCiv(m).includes(v))))return un;
  if(isRemote(pi)){
    const r=await remoteAsk(pi,{kind:'mana',cardId:card.id,cardUid:card.uid,need,civs,list:un.map(m=>({uid:m.card.uid,id:m.card.id}))});
    if(!r||!Array.isArray(r.sel))return null;

}
function manaSelState(){
  const M=UI.manaSel,chosen=[...M.sel].map(i=>M.list[i]);
  const civ=M.civs.every(v=>chosen.some(m=>mCiv(m).includes(v)));

/* 各ターンに1度のコスト軽減（グランドクロス・サザンの天宝） */
function onceRed(pi,card,face){
  if(!G||!G.p)return [];const P=G.p[pi],d=defOf(card,face||'c'),out=[];
  if(d.type==='c'&&face!=='s')P.shields.forEach(s=>{if(s.up&&DEFS[s.id].grandX&&s.orT!==G.turnNo)out.push(s);});
  P.bz.forEach(x=>{if(!ignored(x)&&D(x).onceRedF&&x.orT!==G.turnNo&&D(x).onceRedF(card,d))out.push(x);});
  (P.ts||[]).forEach(x=>{if(!ignored(x)&&D(x).sazan&&x.orT!==G.turnNo&&(isCmd(card)))out.push(x);});
  return out;
}

async function draw(pi,n){

async function smaxPay(pi,c,why){

  if(D(c).smaxAlt==='shield'&&P.shields.length)opts.push({label:'自分のシールドを1つ墓地に置く',value:2});

    const v=P.cpu?opts[0].value:await ask(pi,`S-MAX進化：${why}かわりに、どうしますか？（『${nameOf(c)}』）`,opts,{card:c});

async function evolveInto(pi,card,srcs,o){

  for(const s of srcs){
    const hi=P.hand.findIndex(x=>x.uid===s.uid);if(!inPlay(pi,s)&&hi>=0){P.hand.splice(hi,1);under.push(plain(s));continue;}
    const gi=P.grave.findIndex(x=>x.uid===s.uid);if(!inPlay(pi,s)&&gi>=0){P.grave.splice(gi,1);under.push(plain(s));continue;}
    const mi=P.mana.findIndex(m=>m.card.uid===s.uid);if(!inPlay(pi,s)&&mi>=0){P.mana.splice(mi,1);under.push(plain(s));}

const costv=x=>D(x).cost===INF?1000:D(x).cost;
async function offerHandEnter(pi,just){

  for(const h of [...P.hand]){
    if(G.over)return;
    const d=D(h);if(!d.handEnter||d.type!=='c'||!P.hand.includes(h))continue;

async function massDestroy(list){
  const obs=[];
  for(const P of G.p)for(const x of P.bz)if(D(x).onAnyDestroyed&&!ignored(x))obs.push(x);
  let n=0;const done=new Set();
  {const seen=new Set();list=list.filter(([pi,x])=>{if(!x.lg)return true;if(seen.has(x.lg))return false;seen.add(x.lg);return true;});}
  for(const [pi,x] of list){
    if(G.over)break;
    if(!inPlay(pi,x))continue;
    if(await destroyCore(pi,x)){n++;done.add(x);}
  }
  if(n>0)for(const o of obs){
    if(G.over)break;
    if(done.has(o)||G.p[o.owner].bz.includes(o))await D(o).onAnyDestroyed(o.owner,o);
  }
  if(!G.over)await graveWatch();
  return n>0;
}

function locate(pi,uid){
  const P=G.p[pi];
  let c=P.hand.find(x=>x.uid===uid);if(c)return{card:c,zone:'hand'};
  c=P.grave.find(x=>x.uid===uid);if(c)return{card:c,zone:'grave'};
  c=(P.hyper||[]).find(x=>x.uid===uid);if(c)return{card:c,zone:'hyper'};
  const m=P.mana.find(x=>x.card.uid===uid);if(m)return{card:m.card,zone:'mana'};
  c=P.bz.find(x=>x.uid===uid);if(c)return{card:c,zone:'bz'};
  c=(P.ts||[]).find(x=>x.uid===uid);if(c)return{card:c,zone:'ts'};
  const top=P.deck[P.deck.length-1];if(top&&top.uid===uid&&peekOn(pi))return{card:top,zone:'deck'};

}
async function chooseSources(pi,card){
  const d=D(card),pool=evoPool(pi,card),t=d.evo||d.neo;
  if(d.evo&&d.evo.kind==='sum'){
    const chosen=[];let sum=0;const need=d.evo.min;
    if(G.p[pi].cpu){for(const x of pool.slice().sort((a,b)=>cmp(costv(b),costv(a)))){if(sum>=need)break;chosen.push(x);sum+=costv(x);}}
    else while(sum<need){
      const x=await choose(pi,`重ねるクリーチャーを選択（コスト合計 ${sum}／${need}）`,pool.filter(y=>!chosen.includes(y)),null,true);
      if(!x)break;chosen.push(x);sum+=costv(x);
    }
    return sum>=need?chosen:null;
  }
  if(d.evo&&d.evo.kind==='multiN'){
    const n=d.evo.n,chosen=[];
    if(G.p[pi].cpu)return pool.slice().sort((a,b)=>cc(a)-cc(b)).slice(0,n);
    for(let i=0;i<n;i++){const x=await choose(pi,`下に重ねるクリーチャーを墓地から選択（${i+1}/${n}）`,pool.filter(y=>!chosen.includes(y)),null,true);if(!x)return null;chosen.push(x);}

  }

    const P=G.p[pi],zs=[['墓地',x=>P.grave.includes(x)],['マナゾーン',x=>P.mana.some(m=>m.card===x)],['バトルゾーン',x=>P.bz.includes(x)]],out=[];
    for(const [nm,f] of zs){const L=pool.filter(f);const x=await choose(pi,`下に重ねるクリーチャーを${nm}から1体選択`,L,nm==='バトルゾーン'?weakPick:smallPick,true);if(!x)return null;out.push(x);}
    return out;
  }
  if(d.evo&&d.evo.kind==='multi'){
    const chosen=[];
    if(G.p[pi].cpu)return pool.slice().sort((a,b)=>cc(a)-cc(b)).slice(0,6);
    while(true){
      const L=pool.filter(y=>!chosen.includes(y));if(!L.length)break;
      const x=await choose(pi,`下に重ねるクリーチャーを墓地から選択（${chosen.length}体選択中${chosen.length?'・終わったら「やめる」':''}）`,L,null,true);

    }
    return chosen.length?chosen:null;
  }
  const s=await choose(pi,`進化元にするクリーチャーを選択（${t.label||''}）`,pool,t.zone==='grave'?bigPick:weakPick,true);
  return s?[s]:null;
}
/* ササゲール：破壊するエレメントを選ぶ */
async function pickSasa(pi,pool,cost,civs,ex){
  const P=G.p[pi],chosen=[];
  const tot=()=>chosen.reduce((a,x)=>a+sasaOf(x),0);
  if(P.cpu){
    if(canPay(pi,cost,civs,ex))return chosen;
    for(const x of pool.slice().sort((a,b)=>sasaOf(b)-sasaOf(a))){chosen.push(x);if(canPay(pi,Math.max(1,cost-tot()),civs,ex))break;}
    return chosen;
  }
  while(true){
    const rest=pool.filter(x=>!chosen.includes(x));if(!rest.length)break;
    const cur=Math.max(1,cost-tot());
    const o=rest.map(x=>({card:x,label:`『${nameOf(x)}』を破壊して、コストを${sasaOf(x)}少なくする`,value:x}));
    o.push({label:`これで決定（支払うコスト ${cur}）`,value:null});
    const v=await ask(pi,'ササゲール：破壊するエレメントを選んでください',o);
    if(!v)break;chosen.push(v);
  }
  return chosen;
}

function cpuWants(pi,card,key,zone){
  const P=G.p[pi],O=G.p[1-pi];
  if(card.id==='c27'&&P.deck.length<10)return false;
  if(zone==='mana'&&P.mana.length<=4)return false;
  if(card.id==='c1'&&P.bz.length===0)return false;
  if(card.id==='c4'&&(!P.bz.length||!targetable(pi).length))return false;
  if(card.id==='c2'&&key!=='free'&&P.mana.length<6)return true;
  if(key==='s'&&card.id==='c22')return false;
  if(key==='alt')return !!D(card).altCpu&&D(card).altCpu(pi,card);
  if(key==='crossFree')return card.crossUid==null||!G.p[pi].bz.some(x=>x.uid===card.crossUid);
  if(key==='cross')return card.crossUid==null||!G.p[pi].bz.some(x=>x.uid===card.crossUid);
  if(key==='galaxy'&&canPay(pi,costOf(pi,card,'c','hand'),civsOf(D(card))))return false;
  if(D(card).cpuWant&&!D(card).cpuWant(pi,key))return false;
  return true;
}
function cpuOptions(pi){
  const P=G.p[pi],out=[];
  const top=P.deck[P.deck.length-1];
  const zones=[['hand',P.hand],['grave',P.grave],['mana',P.mana.map(m=>m.card)],['bz',P.bz],['ts',P.ts||[]],['deck',top&&peekOn(pi)?[top]:[]]];
  for(const[zone,list]of zones)for(const card of list){
    for(const op of playOptions(pi,card,zone)){
      if(op.why)continue;
      if(!cpuWants(pi,card,op.key,zone))continue;
      let cst;
      if(op.key==='free'||op.key==='mugen')cst=20;
      else if(op.key==='galaxy')cst=2;
      else if(op.key==='rinne')cst=12;
      else if(op.key==='ben'&&hasR(card,'ディスタス'))cst=20;
      else cst=costOf(pi,card,op.key==='s'?'s':'c',zone);
      out.push({card,zone,key:op.key,score:(cst===INF?15:cst)+(op.key==='mugen'?5:0)+(op.key==='joe'?1:0)});
    }
  }
  return out.sort((a,b)=>b.score-a.score);
}
function cpuChargePick(pi){
  const P=G.p[pi],have={};
  P.mana.forEach(m=>mCiv(m).forEach(v=>have[v]=1));
  let best=null,bs=-99;
  for(const c of P.hand){
    const cst=cardCost(c)===INF?12:cardCost(c);
    let s=cst-P.mana.length-1;
    if(civOf(c).some(v=>v!=='無'&&!have[v]))s+=3;
    if(D(c).mugen||D(c).freeIf)s-=2;
    if(s>bs){bs=s;best=c;}
  }
  return best;
}
function cpuTarget(pi,a){
  const opts=targetOptions(pi,a);if(!opts.length)return null;
  const O=G.p[1-pi],ap=pow(a,true);
  const crs=opts.filter(o=>o.value.kind==='creature');
  const must=!opts.some(o=>o.value.kind!=='creature');
  const kills=crs.filter(o=>cmp(pow(o.value.c),ap)<0||winsAll(a)).sort((x,y)=>cmp(pow(y.value.c),pow(x.value.c)));
  if(kills.length&&(must||Math.random()<0.6))return kills[0].value;
  if(must){
    const s=crs.sort((x,y)=>cmp(pow(x.value.c),pow(y.value.c)))[0];
    return s?s.value:null;
  }
  const bl=O.bz.filter(x=>hasBlocker(x));
  if(bl.some(b=>cmp(pow(b),ap)>0)&&Math.random()<0.5)return null;
  return opts.find(o=>o.value.kind!=='creature').value;
}
async function cpuTurn(pi){
  const P=G.p[pi];await sleep(400);
  if(P.hand.length){
    const pick=cpuChargePick(pi);
    zoneRemove(pi,pick,'hand');await charisma(pi,await putMana(pi,pick));
    G.charged=true;
    log(`${P.name}はマナゾーンにカードを1枚置いた`);render();await sleep(450);
  }
  const failed=new Set();
  const skp=()=>!!(G.skipT&&G.skipT[pi]===G.turnNo);
  for(let g=0;g<24&&!G.over&&!skp();g++){
    const opts=cpuOptions(pi).filter(o=>!failed.has(o.card.uid+o.key));
    if(!opts.length)break;
    const o=opts[0];
    const ok=await runPlay(pi,o.card,o.zone,o.key);
    if(!ok)failed.add(o.card.uid+o.key);
    await sleep(450);
  }
  for(let pass=0;pass<3&&!G.over&&!skp();pass++){
    let did=false;
    for(const a of [...P.bz].sort((x,y)=>cmp(pow(y),pow(x)))){
      if(G.over)return;
      if(skp())break;
      if(!P.bz.includes(a)||!canAtk(a))continue;
      const t=cpuTarget(pi,a);if(!t)continue;
      await attack(pi,a,t);did=true;await sleep(500);
    }
    if(!did)break;
  }
}

async function doPlay(pi,uid,key){
  if(!turnOK(pi))return;
  const f=locate(pi,uid);if(!f)return;
  const op=playOptions(pi,f.card,f.zone).find(o=>o.key===key);
  if(!op||op.why)return;

  try{await runPlay(pi,f.card,f.zone,key);if(!G.over)await zeroCheck();}catch(e){console.error(e);log('エラーが起きました：'+(e&&e.message));}

}
async function doAttack(pi,uid){
  if(!turnOK(pi))return;
  const a=G.p[pi].bz.find(x=>x.uid===uid);if(!a||!canAtk(a))return;
  if(pi===ME)UI.sheet=null;G.busy=true;render();

    const t=await chooseTarget(pi,a);
    if(t)await attack(pi,a,t);
  }catch(e){console.error(e);log('エラーが起きました：'+(e&&e.message));}

async function skipCheck(pi){

async function doEnd(pi){
  if(!turnOK(pi))return;
  if(pi===ME)UI.sheet=null;G.busy=true;log(`${G.p[pi].name}はターンを終了した`);render();
  await endTurn(pi);if(G.over)return;

  if(NET.role==='guest'){if(!turnOK(ME))return;UI.sheet=null;sendAct({type,uid,key});render();return;}

      if(sc&&G.scarT[q]!==G.turnNo){
        const L=nw[q].filter(x=>P.grave.includes(x)&&nonEvo(x)&&cc(x)<=5&&!putBlocked(q,x));
        const x=await choose(q,'スカーレッドゾーン：墓地に置かれたコスト5以下のクリーチャーを出す（各ターン1度）',L,bigPick,true);

async function playFree(pi,card,zone,o={}){

  if(face==='c'&&d.type!=='s'&&d.side&&o.preferSpell)face='s';
  if(zone==='reveal')zone='deckfx';
  const df=defOf(card,face);
  if(df.type==='c'&&(putBlocked(pi,card)||d.evo)){log(`『${df.name}』は出せなかった`);return false;}
  if(df.type==='s'&&spellBanned(pi,df)){log(`『${df.name}』は唱えられなかった`);return false;}
  await playCard(pi,card,Object.assign({free:true,from:zone,face,via:'effect',summon:true},o));
  return true;
}

async function playFreeAny(pi,card,zone,f,o={}){
  const d=D(card);
  const faces=[];
  if(f(d)&&(d.type!=='c'||(!d.evo&&!putBlocked(pi,card)))&&(d.type!=='s'||!spellBanned(pi,d)))faces.push('c');
  if(d.side&&f(d.side)&&!spellBanned(pi,d.side))faces.push('s');
  if(!faces.length)return false;
  let face=faces[0];
  if(faces.length>1&&!G.p[pi].cpu){
    const v=await ask(pi,`『${d.name}』のどちらを実行しますか？`,[{label:`${d.name}（${d.type==='c'?'クリーチャー':'タマシード'}）`,value:'c'},{label:`${d.side.name}（呪文）`,value:'s'}]);

  }
  return playFree(pi,card,zone,Object.assign({},o,{face}));
}

  try{for(const q of [G.cur,1-G.cur]){if(G.over)return;const P=G.p[q];if(!P||!P.deck||P.deck.length)continue;

    if((G.noLoseP&&G.noLoseP[q])||(G.noLoseT&&G.noLoseT[q]===G.turnNo)){G.doLog=G.doLog||{};const k=q+':'+G.turnNo;if(G.doLog[k])continue;G.doLog[k]=1;}
    await win(1-q,`${P.name}の山札がなくなりました`);}}finally{G.doBusy=false;}

async function zeroCheck(){
  await deckOutCheck();if(G.over)return;

  try{for(let k=0;k<20&&!G.over;k++){const L=[0,1].flatMap(q=>G.p[q].bz.filter(x=>D(x).type==='c'&&((x.zeroT===G.turnNo)||(pow(x)!==INF&&pow(x)<=0))).map(x=>[q,x]));if(!L.length)break;for(const [q,x] of L)log(`『${nameOf(x)}』はパワーが0以下なので破壊される`);const before=L.map(([q,x])=>x);await massDestroy(L);if(before.every(x=>G.p[x.owner].bz.includes(x))&&k>0)break;}}finally{G.zcBusy=false;}
}

  const c=L.filter(ok);

/* 山札の上から n 枚見て、条件に合う1枚を手札に、残りを山札の下へ */
async function lookPick(pi,n,f,title,opt={}){
  const L=lookN(pi,n);if(!L.length)return null;
  if(!G.p[pi].cpu||opt.reveal)log(`山札の上から${L.length}枚を見た`);
  const c=L.filter(f||(()=>true));
  const p=await pickZ(pi,title||'手札に加えるカードを選択',c.map(card=>({card,z:'reveal'})),opt.cpuPick||bestRecover,!opt.must);
  const rest=L.filter(x=>!p||x!==p.card);
  if(p){G.p[pi].hand.push(plain(p.card));log(`${opt.reveal?`『${nameOf(p.card)}』`:'1枚'}を手札に加えた`);}
  if(opt.restTo==='topOrBottom'&&rest.length){
    const v=await modeAsk(pi,`残りの${rest.length}枚を、山札の上と下のどちらに置きますか？`,[{label:'山札の上',value:'top'},{label:'山札の下',value:'bottom'}],'bottom');
    if(v==='top')rest.forEach(x=>G.p[pi].deck.push(plain(x)));else bottomAll(pi,rest);
    log(`残りを山札の${v==='top'?'上':'下'}に置いた`);
  }
  else if(opt.restTo==='mana'){for(const x of rest)await putMana(pi,x,true);}
  else if(opt.restTo==='grave')rest.forEach(x=>G.p[pi].grave.push(plain(x)));
  else bottomAll(pi,rest);
  render();
  return p?p.card:null;
}
/* 合計コストが limit 以下になるように好きな数出す */
async function putTotal(pi,zones,f,limit,title){
  let used=0;
  while(!G.over){
    const L=zc(pi,zones,x=>(nonEvo(x)||DEFS[x.id].type==='t')&&f(x)&&cc(x)<=limit-used&&!putBlocked(pi,x));
    if(!L.length)break;
    const p=await pickZ(pi,`${title}（残りコスト${limit-used}）`,L,bigPick,true);
    if(!p)break;
    used+=cc(p.card);
    await putFrom(pi,p.card,p.z);
  }
}

/* 封印が墓地に置かれた時（ドルーター） */
async function sealBack(pi,list){
  const P=G.p[pi];
  for(const s of list){
    if(G.over)return;
    if(!P.bz.some(x=>D(x).sealBack&&!ignored(x)))return;
    const g=P.grave.find(x=>x.uid===s.uid);if(!g)continue;
    if(await askYN(pi,`ドルーター：墓地に置かれた封印『${nameOf(g)}』を手札に戻しますか？`,g,true)){P.grave.splice(P.grave.indexOf(g),1);P.hand.push(plain(g));log(`封印だった『${nameOf(g)}』を手札に戻した`);render();}
  }
}

function enterLock(pi,card,o){
  const d=D(card);
  return G.p[1-pi].bz.some(x=>!ignored(x)&&((D(x).million&&!(o.fromHand&&o.played))||(D(x).handOnly&&d.type==='c'&&!o.fromHand)));
}

/* スケルハンター：相手のクリーチャーはターンのはじめ以外アンタップしない */
function tapGuard(c){
  let t=!!c.tapped;
  Object.defineProperty(c,'tapped',{enumerable:true,configurable:true,get(){return t;},set(v){
    v=!!v;
    if(!v&&t&&G&&!G.untapPhase&&c.owner!==undefined&&G.p[1-c.owner]&&G.p[1-c.owner].bz.some(x=>D(x).skelLock&&!ignored(x))){log(`スケルハンター：『${nameOf(c)}』はターンのはじめ以外アンタップしない`);return;}
    t=v;}});
}
/* ジ・オリジナル：相手がクリーチャーを選ぶ時、かわりに自分が選ぶ */
function origChooser(pi,cards){
  const q=1-pi;if(!G||!G.p[q])return null;
  if(!G.p[q].shields.some(s=>s.up&&DEFS[s.id].chooseInstead))return null;
  return cards.some(c=>c.owner!==undefined&&G.p[c.owner]&&G.p[c.owner].bz.includes(c))?q:null;
}

async function graveSpell(pi,lim){
  const L=[];
  for(const q of [pi,1-pi])G.p[q].grave.forEach(x=>{const d=D(x);if((d.type==='s'&&d.cost<=lim&&!spellBanned(pi,d))||(d.side&&d.side.type==='s'&&d.side.cost<=lim&&!spellBanned(pi,d.side)))L.push({card:x,z:q===pi?'grave':'opp',q});});
  const p=await pickZ(pi,`墓地から唱える呪文（コスト${lim}以下）`,L,bigPick,true);if(!p)return;
  const q=p.q;const d=D(p.card);const face=d.type==='s'&&d.cost<=lim?'c':'s';
  zoneRemove(q,p.card,'grave');

async function mizuha(pi){
  const O=G.p[1-pi];const L=lookN(1-pi,3);if(!L.length)return;
  log(`ミヅハノクエビコ：相手の山札の上から${L.length}枚を表向きにした：${revealTxt(L)}`);
  const sp=L.filter(x=>{const d=DEFS[x.id];return (d.type==='s'&&!spellBanned(pi,d))||(d.side&&d.side.type==='s'&&!spellBanned(pi,d.side));});
  const p=await pickZ(pi,'コストを支払わずに唱える相手の呪文',sp.map(card=>({card,z:'reveal'})),bigPick,true);
  L.filter(x=>!p||x!==p.card).forEach(x=>O.deck.unshift(plain(x)));render();
  if(!p)return;
  const d=DEFS[p.card.id];
  await playCard(pi,p.card,{free:true,from:'deckfx',face:d.type==='s'?'c':'s',via:'effect',ownerPi:1-pi});
}

DEFS.c379={name:'龍V王 Q.E.D.',civ:['水'],cost:5,power:8000,type:'c',race:['クリスタル・コマンド・ドラゴン','革命軍','ハムカツ団'],kw:['blocker','justDiver','wbreaker'],

    const tp=x=>{const d=DEFS[x.id];return d.field?'f':d.type;};
    const used=new Set(),take=[];
    while(true){
      const c=L.filter(x=>!take.includes(x)&&!used.has(tp(x)));

async function gaiginga(pi){
  const P=G.p[pi];const t=P.deck[P.deck.length-1];if(!t)return;
  if(!await askYN(pi,'ガイギンガ：山札の上を表向きにしますか？',null,true))return;
  log(`山札の上を表向きにした：『${nameOf(t)}』`);
  if((nonEvo(t)||DEFS[t.id].type==='t')&&cc(t)<=4&&!putBlocked(pi,t)&&await askYN(pi,`『${nameOf(t)}』を出しますか？`,t,true)){P.deck.pop();await putOnBZ(pi,plain(t),{summon:false});return;}
  P.deck.pop();P.hand.push(t);log(`『${nameOf(t)}』を手札に加えた`);render();
}

const HYZ=n=>`${n>1?'OVER':''}ハイパー化：自分の他のクリーチャーを${n}体タップする。（自分のメインステップ中に、ハイパーモードを解放できる。ハイパーモードは次の自分のターンのはじめまで続く）`;

const shieldToHandF=async(pi,filter)=>{const P=G.p[pi];const L=P.shields.filter(filter||(()=>true));if(!L.length)return null;const s=L[L.length-1];P.shields.splice(P.shields.indexOf(s),1);P.hand.push(plain(s));log('シールドを1つ手札に加えた（S・トリガーは使えない）');render();await shieldsGone(pi,[s]);return s;};

const sumPowKill=async(pi,lim,may)=>{let used=0;const ch=[];while(true){const L=targetable(pi).filter(x=>!ch.includes(x)&&pow(x)!==INF&&pow(x)<=lim-used);if(!L.length)break;const t=await choose(pi,`破壊する相手のクリーチャー（残りパワー${lim-used}）`,L,strongPick,true);if(!t)break;ch.push(t);used+=pow(t);}if(ch.length)await massDestroy(ch.map(x=>[1-pi,x]));};

const castFreeSpell=async(pi,zones,f,toBottom,title)=>{
  const L=zc(pi,zones,x=>{const d=D(x);return [d.type==='s'?d:null,d.side&&d.side.type==='s'?d.side:null].some(s=>s&&s.cost!==INF&&f(s)&&!spellBanned(pi,s));});
  const p=await pickZ(pi,title,L,bigPick,true);if(!p)return false;const d=D(p.card);const face=d.type==='s'&&f(d)?'c':'s';

};

async function abyssMek(pi){
  const P=G.p[pi];const L=lookN(pi,6);if(!L.length)return;log(`アビス・W・メクレイド5：山札の上から${L.length}枚を見た`);
  const ok=x=>{const d=D(x);if(!hasR(x,'アビス'))return false;return [d,d.side].some(dd=>dd&&dd.cost!==INF&&dd.cost<=5&&(dd.type!=='c'||(!d.evo&&!putBlocked(pi,x)))&&(dd.type!=='s'||!spellBanned(pi,dd)));};
  const take=[];for(let i=0;i<2;i++){const p=await pickZ(pi,`コストを支払わずに実行するアビス（${i+1}/2・コスト5以下）`,L.filter(x=>!take.includes(x)&&ok(x)).map(card=>({card,z:'reveal'})),bigPick,true);if(!p)break;take.push(p.card);}
  bottomAll(pi,L.filter(x=>!take.includes(x)));render();
  for(const x of take){if(G.over)return;await playFreeAny(pi,x,'deckfx',dd=>dd.cost<=5);}
}

function playableId(id){const d=DEFS[id];if(!d||d.gr||d.hidden||d.cell||d.cost===INF||d.cost>=20&&!d.freeIf&&!d.costRed)return false;if(d.kyomu)return false;return true;}
function deckBuild(th){
  const civOK=id=>civOf({id}).every(v=>v==='無'||th.civs.includes(v));
  let pool=CARD_IDS.filter(id=>playableId(id)&&civOK(id)&&(!th.only||th.only(id)));
  const base=pool.filter(id=>DEFS[id].type==='c'&&!DEFS[id].evo);
  pool=pool.filter(id=>{const d=DEFS[id];if(!d.evo)return true;if(d.evo.kind!=='one')return false;let n=0;for(const b of base){try{if(d.evo.test({id:b}))n++;}catch(e){}}return n>=6;});
  const tag=id=>th.tags.some(t=>hasR({id},t)||DEFS[id].name.includes(t)||(t==='G城'&&DEFS[id].castle));
  const sc=id=>{const d=DEFS[id];let s=Math.random()*3;if(tag(id))s+=8;if(d.st||(d.side&&d.side.st))s+=2;if(civOf({id}).length>1&&civOf({id}).every(v=>th.civs.includes(v)))s+=1;if(d.cost>=9&&!tag(id))s-=4;if(th.prefer)s+=th.prefer(id)||0;return s;};
  const ranked=pool.map(id=>({id,s:sc(id)})).sort((a,b)=>b.s-a.s);
  const bucket=c=>c<=2?0:c===3?1:c===4?2:c===5?3:c<=7?4:5;const want=[8,8,7,6,6,5];const have=[0,0,0,0,0,0];
  const out={};let total=0;
  const add=(id,k)=>{const b=bucket(DEFS[id].cost);k=Math.min(k,4-(out[id]||0),40-total);if(k<=0)return;out[id]=(out[id]||0)+k;total+=k;have[b]+=k;};
  for(const {id,s} of ranked){if(total>=40)break;const b=bucket(DEFS[id].cost);if(have[b]>=want[b])continue;add(id,Math.min(want[b]-have[b],s>10?4:s>6?3:2));}
  for(const {id} of ranked){if(total>=40)break;add(id,2);}
  for(const {id} of ranked){if(total>=40)break;add(id,4);}
  const ids=[];Object.entries(out).forEach(([id,k])=>{for(let i=0;i<k;i++)ids.push(id);});
  return ids.length===40?ids:null;
}

kyomuCheck=async function(pi,o={}){
  const P=G.p[pi];
  for(const src of [...P.hand.map(card=>({card,z:'hand'})),...P.grave.map(card=>({card,z:'grave'}))]){
    if(G.over)return;const d=D(src.card);
    const kind=o.zetsu?(d.zetsu?'絶':null):o.cr?(d.mugenGate?'夢幻':null):(d.kyomu?'虚無月':d.mugenGate?'夢幻':null);
    if(!kind||!inZone(pi,src.card,src.z)||putBlocked(pi,src.card))continue;
    const need=kind==='絶'?6:4;
    const pool=[...P.bz.filter(x=>hasR(x,'魔導具')).map(x=>({card:x,z:'bz'})),...P.grave.filter(x=>x.uid!==src.card.uid&&hasR(x,'魔導具')).map(x=>({card:x,z:'grave'}))];
    if(pool.length<need)continue;
    if(!await askYN(pi,`${kind}の門：魔導具${need}つの上に『${d.name}』を${src.z==='hand'?'手札':'墓地'}から召喚しますか？`,src.card,true))continue;
    const take=[];
    for(let i=0;i<need;i++){const p=await pickZ(pi,`重ねる魔導具（${i+1}/${need}）`,pool.filter(x=>!take.includes(x)),l=>l.find(y=>!P.bz.includes(y))||l[0]);if(!p)break;take.push(p);}
    if(take.length<need)continue;
    const under=[];
    for(const t of take){if(t.z==='grave'){zoneRemove(pi,t.card,'grave');under.push(plain(t.card));}else{const i=P.bz.indexOf(t.card);if(i>=0){P.bz.splice(i,1);(t.card.seals||[]).forEach(s=>P.grave.push(plain(s)));under.push(plain(t.card),...(t.card.under||[]).map(plain));}}}
    zoneRemove(pi,src.card,src.z);log(`${kind}の門！`);
    await putOnBZ(pi,plain(src.card),{summon:true,via:'gate',under,evolved:true,sick:false});
    await afterGate(pi);return;
  }
};

  for(const [n,name] of D0.c){const id=dkFind(name);if(id){const lim=DEFS[id].anyNum?99:4;const k=Math.min(n,lim-(cnt[id]||0));for(let j=0;j<k;j++)out.push(id);cnt[id]=(cnt[id]||0)+k;civOf({id}).forEach(v=>civs.add(v));if(k<n)miss.push([n-k,name]);}else miss.push([n,name]);}
  const need=40-out.length;const subs=[];
  if(need>0){
    const okCiv=id=>civOf({id}).every(v=>v==='無'||civs.has(v));
    const pool=shuffle(CARD_IDS.filter(id=>playableId(id)&&!DEFS[id].evo&&okCiv(id)&&(cnt[id]||0)<4));
    const pref=pool.filter(id=>cnt[id]);const rest=pool.filter(id=>!cnt[id]);
    for(const id of [...pref,...rest]){if(out.length>=40)break;const k=Math.min(4-(cnt[id]||0),40-out.length,cnt[id]?4:2);for(let j=0;j<k;j++){out.push(id);subs.push(id);}cnt[id]=(cnt[id]||0)+k;}
    if(out.length<40){const any=shuffle(CARD_IDS.filter(id=>playableId(id)&&!DEFS[id].evo&&(cnt[id]||0)<4));for(const id of any){if(out.length>=40)break;out.push(id);subs.push(id);cnt[id]=(cnt[id]||0)+1;}}
  }
  return {ids:out.slice(0,40),miss,subs};
}
function officialMissN(i){return officialResolve(i).miss.reduce((a,b)=>a+b[0],0);}
function officialLabel(i){const n=officialMissN(i);return `${i+1}. ${OFFICIAL_DECKS[i].n}${n?`（未収録${n}枚は代用）`:''}`;}

}

async function mekuraidW(pi,n,f,label,look,cnt){
  look=look||6;cnt=cnt||2;const L=lookN(pi,look);if(!L.length)return;
  log(`${label||'W・メクレイド'}${n}：山札の上から${L.length}枚を見る`);
  const ok=x=>{const d=D(x);if(!f(x))return false;if(d.cost!==INF&&d.cost<=n)return (d.type!=='c'||(!d.evo&&!putBlocked(pi,x)))&&(d.type!=='s'||!spellBanned(pi,d));if(d.side&&d.side.cost<=n)return !spellBanned(pi,d.side);return false;};

const q24pickShieldsAny=async(pi,title)=>{const P=G.p[pi];if(P.cpu){const n=Math.max(0,P.shields.length-2);return P.shields.slice(P.shields.length-n);}return pickOwnShields(pi,P.shields.length,title);};

async function q25Sangan(pi){
  const P=G.p[pi];if(!P.deck.length)return;
  const L=P.deck.slice(0,Math.min(2,P.deck.length));
  log(`邪王来混沌三眼鬼：山札の下から${L.length}枚を表向きにした：${revealTxt(L)}`);render();
  const ev=await choose(pi,'出す、コスト5以下の進化クリーチャー（最大1体）',L.filter(x=>DEFS[x.id].type==='c'&&DEFS[x.id].evo&&cc(x)<=5&&!putBlocked(pi,x)&&evoFeasible(pi,x)),bigPick,true);

const CODE_CHARS='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(){let s='';for(let i=0;i<5;i++)s+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)];return s;}

function gdoc(suffix){return NET.db.doc(`games/${NET.code}${suffix||''}`);}
function fsAdapter(fs){
  const wrap=s=>({id:s.id,exists:!!s.exists,data:()=>s.exists?s.data():undefined,metadata:{}});
  const clean=d=>JSON.parse(JSON.stringify(d));
  return{doc:path=>{const r=fs.doc(path);return{id:r.id,path,
    get:async()=>wrap(await r.get()),
    set:d=>r.set(clean(d)),
    delete:()=>r.delete(),
    onSnapshot:(next,err)=>r.onSnapshot(sn=>next(wrap(sn)),err)};}};
}
async function netInit(){

    if(typeof firebase==='undefined'){throw {message:'Firebaseの部品を読み込めませんでした。ネットワークを確認してください。'};}
    if(typeof FIREBASE_CONFIG==='undefined'||!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey||String(FIREBASE_CONFIG.apiKey).indexOf('ここ')>=0){throw {message:'firebase-config.js に、Firebaseの設定（firebaseConfig）がまだ入っていません。'};}
    firebase.initializeApp(FIREBASE_CONFIG);
    await firebase.auth().signInAnonymously();
    const fsi=firebase.firestore();try{fsi.settings({experimentalAutoDetectLongPolling:true,merge:true});}catch(_e){}NET.db=fsAdapter(fsi);NET.canWrite=true;
  }catch(e){NET.db=null;NET.err=(e&&e.message)||String(e);}
  render();
}

const WRITE_MSG='この画面ではデータの書き込みができません（閲覧のみの権限です）。オンライン対戦は、書き込み権限（共同利用者以上）のある人どうしでだけ遊べます。リンクを開いただけの友だちは、まだ使えません。';
function explainErr(e,what){
  const c=(e&&e.code)||'';
  if(c==='permission-denied'||c==='unauthenticated')return what+'：Firebaseのルールで拒否されました。Firestoreのルールが「ログイン済みなら読み書き可」になっているか確認してください。（'+c+'）';
  if(c==='invalid_argument'||c==='not_granted'||c==='revoked'||c==='capability_disabled'||c==='capability_removed')return what+'：'+WRITE_MSG+'（'+c+'）';
  if(c==='quota_exceeded')return what+'：保存の上限に達しました。（'+c+'）';
  if(c==='resource_exhausted')return what+'：操作が多すぎます。少し待ってからもう一度試してください。';
  if(c==='unavailable')return what+'：通信が不安定です。もう一度試してください。';
  if(c==='timeout')return what+'：10秒待ってもFirebaseから返事がありません。Firestoreのデータベースが作成されていない、または通信がふさがれている可能性があります。Firebaseコンソールの「Firestore Database」を確認してください。';
  return what+'：'+((e&&(e.code||e.message))||'原因不明');
}
async function hostCreate(){
  if(!NET.db||NET.role||NET.busy)return;
  if(!validIds(myDeckIds())){NET.err='デッキがちょうど40枚（同じカードは4枚まで）になっていません。「デッキを編集」で直してください。';render();return;}
  if(NET.canWrite===false){NET.err=WRITE_MSG;render();return;}
  const code=genCode();NET.err='';NET.busy=true;render();
  try{await Promise.race([NET.db.doc(`games/${code}`).set({phase:'lobby',t:Date.now()}),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);}
  catch(e){NET.busy=false;NET.err=explainErr(e,'部屋をつくれませんでした');render();return;}
  NET.busy=false;
  resetNet();NET.role='host';NET.code=code;NET.askBase=Math.random().toString(36).slice(2,8);ME=0;NET.err='';
  UI.screen='lobby';render();
  const er=e=>netErr(explainErr(e,'通信エラー'));
  try{
    await Promise.all(['-join','-act','-ans','-ask'].map(x=>gdoc(x).delete()));
    NET.unsubs.push(gdoc('-join').onSnapshot(handleJoin,er),gdoc('-act').onSnapshot(handleAct,er),gdoc('-ans').onSnapshot(handleAns,er));

}

   Firestore の games/SHARED-DECKS に保存。アプリを更新しても消えず、
   「みんなのデッキから削除」を押したときだけ消える。
   カードはIDと名前の両方で保存し、将来IDが変わっても名前で復元する。 */
const SHARE={on:false,decks:{},unsub:null,err:'',delArm:null,busy:false};
function shareRef(){return firebase.firestore().doc('games/SHARED-DECKS');}
function shareStart(){
  if(SHARE.unsub||!NET.db||typeof firebase==='undefined')return;
  try{
    SHARE.unsub=shareRef().onSnapshot(sn=>{const d=sn.exists?sn.data():null;SHARE.decks=(d&&d.decks)||{};SHARE.on=true;SHARE.err='';if(typeof render==='function'&&!(G&&UI.screen==='game'))render();},
      e=>{SHARE.err='みんなのデッキを読み込めませんでした（'+((e&&e.code)||'通信エラー')+'）';render();});
  }catch(e){SHARE.err='みんなのデッキを読み込めませんでした';}
}

/* 共有デッキ → この端末のカードIDに直す */
function shareResolve(sd){
  const cards={};let miss=0;
  for(const [id,n] of Object.entries(sd.cards||{})){
    let use=null;const nm=(sd.names||{})[id];
    if(DEFS[id]&&(!nm||DEFS[id].name===nm))use=id;else if(nm)use=dkFind(nm);
    if(use&&DEFS[use]){const lim=DEFS[use].anyNum?99:4;cards[use]=Math.min(lim,(cards[use]||0)+(+n||0));}else miss+=(+n||0);
  }

function deckStats(){
  const ids=CARD_IDS.filter(id=>UI.myDeck[id]);
  const n=deckTotal();
  const curve=[0,0,0,0,0,0,0,0];let cr=0,sp=0,ts=0,tw=0,st=0,fd=0,ca=0;const civ={};
  ids.forEach(id=>{const k=UI.myDeck[id],d=DEFS[id],v=dCost(id);curve[Math.min(7,Math.max(0,v-1))]+=k;
    const ct=catOf(id);if(ct==='c')cr+=k;else if(ct==='t')ts+=k;else if(ct==='tw')tw+=k;else if(ct==='f'||ct==='xg')fd+=k;else if(ct==='castle')ca+=k;else sp+=k;
    if(d.st||d.superST||(d.side&&d.side.st))st+=k;
    civOf({id}).forEach(v=>civ[v]=(civ[v]||0)+k);});
  const mx=Math.max(1,...curve);
  const bars=curve.map((v,i)=>`<div class="cb"><span class="cbn">${v||''}</span><div class="cbb" style="height:${Math.round(v/mx*64)}px"></div><span class="cbl">${i===7?'8+':i+1}</span></div>`).join('');
  const civs=CIV_ORDER.filter(v=>civ[v]).map(v=>`<span class="cvc" style="--civ:${CIVC[v]}">${v} ${civ[v]}</span>`).join('');
  return `<div class="dstat"><div class="curve">${bars}</div><div class="dsum"><span>クリーチャー ${cr}</span><span>呪文 ${sp}</span><span>タマシード ${ts}</span><span>ツインパクト ${tw}</span>${fd?`<span>フィールド・クロスギア ${fd}</span>`:''}${ca?`<span>城 ${ca}</span>`:''}<span>S・トリガー系 ${st}</span></div><div class="dciv">${civs||'<span class="note">まだカードがありません</span>'}</div></div>`;
}

  <p><b>タマシード</b>：クリーチャーではないエレメントです。バトルゾーンに点線の枠で表示されます。攻撃やブロックはしません。</p>
  <p><b>ササゲール</b>：ディスペクターを召喚する時、ササゲールを持つ自分のエレメントを破壊して、コストを少なくできます（召喚の時に選べます）。</p>

  if(UI.screen==='game'&&G){if(UI.grave!==null)h+=graveHTML();if(UI.hyperV!=null)h+=hyperHTML();if(UI.log)h+=logHTML();}
  if(UI.rules)h+=rulesHTML();

  if(mainOver(ME))return `<div class="gguide">${'<span class="gst done">✓ ① マナ</span><i class="garr">›</i><span class="gst done">✓ ② カードを使う</span><i class="garr">›</i>'}<span class="gst ${P.bz.some(c=>canAtk(c))?'on':''}">③ 攻撃する</span><i class="garr">›</i><span class="gst ${P.bz.some(c=>canAtk(c))?'':'on'}">④ ターン終了</span></div><p class="ghint">攻撃したあとは、手札からカードを使ったりマナを置いたりできません（キリフダッシュなど、能力で出すものは使えます）。</p>`;
  const canPlay=P.hand.some(c=>playOptions(ME,c,'hand').some(o=>!o.why&&o.key!=='mana'));
  const canAtkAny=P.bz.some(c=>canAtk(c));
  const chargeDone=G.charged||G.mainT===G.turnNo;
  const st=(done,on,t)=>`<span class="gst ${done?'done':''} ${on?'on':''}">${done?'✓ ':''}${t}</span>`;
  return `<div class="gguide">
    ${st(chargeDone,!chargeDone,G.charged||G.mainT!==G.turnNo?'① マナを1枚置く':'① マナ（置かずに進んだ）')}<i class="garr">›</i>${st(false,canPlay,'② カードを使う')}<i class="garr">›</i>${st(false,canAtkAny,'③ 攻撃する')}<i class="garr">›</i>${st(false,!canPlay&&!canAtkAny&&chargeDone,'④ ターン終了')}
    <span class="gmana">使えるマナ <b>${un}</b>/${P.mana.length}</span></div>
    <p class="ghint">${chargeDone?'':'最初に、手札のカードを押して「マナにチャージ」ができます（1ターンに1枚）。カードを使ったり攻撃したりすると、もうマナは置けません。'}<span class="gok">緑に光っているカード</span>が、いま使える・攻撃できるカードです。カードを押すと能力も見られます。</p>`;
}
gameHTML=function(){
  const my=G.cur===ME&&!G.over;
  const last=G.log[G.log.length-1]||'';
  const who=G.cur===ME?'あなたのターン':(NET.role?'相手のターン':'CPUのターン');
  const hdr=`<header class="hdr ghdr ${G.cur===ME?'me':'op'}"><div class="turn"><b class="gturn">${G.over?'対戦終了':who}${G.inExtra?'（追加ターン）':''}</b><span>ターン${G.turnNo}</span></div><div class="btns">${NET.role?`<button data-do="leave">${UI.leaveArm?'本当に中断':'中断'}</button>`:''}<button data-do="log">ログ</button><button data-do="rules">ルール</button><button class="primary gend" data-do="end" ${myTurnOK()?'':'disabled'}>ターン終了 ▶</button></div></header>`;
  const msg=`<div class="msg gmsg">${NET.role&&NET.err?`<span class="warn">${esc(NET.err)}</span> `:''}${NET.role&&G.wait!=null&&G.wait!==ME&&!G.over?'<strong>相手の入力を待っています…</strong> ':''}<span class="glast">${esc(last)}</span>${my&&!G.busy&&G.debt[ME]?`<em>逆転撃の代償：次のターンにマナ${G.debt[ME]}枚</em>`:''}</div>`;
  const opp=zoneHTML(1-ME).replace('<section class="zone theirs">',`<section class="zone theirs"><div class="zhead op">${NET.role?'相手':'CPU'}の場</div>`);
  const mine=zoneHTML(ME).replace('<section class="zone mine">','<section class="zone mine"><div class="zhead me">あなたの場</div>');
  return hdr+gameGuideHTML()+msg+opp+`<div class="mid"></div>`+mine;
};
/* 攻撃したあとは、メインステップが終わっているので手札などからカードを使えない（マナも置けない） */
function mainOver(pi){return !!(G&&!G.effPlay&&G.cur===pi&&G.atkN&&G.atkN[pi]>0);}
{const _po=playOptions;playOptions=function(pi,card,zone){const L=_po(pi,card,zone);if(!mainOver(pi))return L;return L.map(o=>o.why?o:Object.assign({},o,{why:'攻撃したあとは使えません'}));};}
try{if(G&&UI.screen==='game')render();}catch(e){}

/* ===== 部屋一覧（作った人の部屋を押すだけで入れる） ===== */
const ROOMS={list:{},unsub:null,hb:null,err:''};
const ROOM_TTL=15*60*1000;
function roomsRef(){return NET.db.doc('games/ROOMS');}
function myNick(){try{return localStorage.getItem('dm26nick')||'';}catch(e){return '';}}
function setNick(v){try{localStorage.setItem('dm26nick',String(v||'').slice(0,12));}catch(e){}}
function roomsStart(){
  if(ROOMS.unsub||!NET.db)return;
  try{ROOMS.unsub=roomsRef().onSnapshot(sn=>{const d=sn.exists?sn.data():null;ROOMS.list=(d&&d.rooms)||{};ROOMS.err='';if(UI.screen==='title'&&UI.menu==='online')render();},e=>{ROOMS.err='部屋一覧を読み込めませんでした';});}catch(e){}
}
function roomsOpen(){const now=Date.now();return Object.entries(ROOMS.list).filter(([c,r])=>r&&now-(r.t||0)<ROOM_TTL&&c!==NET.code).sort((a,b)=>(b[1].t||0)-(a[1].t||0));}
async function roomPut(code){const nm=myNick()||'だれか';const d=UI.pSel&&UI.pSel.startsWith('o:')?OFFICIAL_DECKS[+UI.pSel.slice(2)].n:(UI.decks&&UI.decks[UI.dcur]?UI.decks[UI.dcur].name:'');
  try{await roomsRef().set({rooms:{[code]:{name:nm,deck:String(d).slice(0,24),t:Date.now()}}},{merge:true});}catch(e){}}
async function roomDel(code){if(!code||!NET.db)return;try{await roomsRef().update({['rooms.'+code]:firebase.firestore.FieldValue.delete()});}catch(e){}}
function roomHB(on){clearInterval(ROOMS.hb);ROOMS.hb=null;if(on)ROOMS.hb=setInterval(()=>{if(NET.role==='host'&&UI.screen==='lobby'&&NET.code)roomPut(NET.code);else roomHB(false);},60000);}
{const _ni=netInit;netInit=async function(){await _ni();roomsStart();};}
{const _hc=hostCreate;hostCreate=async function(){try{const n=document.getElementById('nickin');if(n&&typeof n.value==='string')setNick(n.value.trim());}catch(e){}await _hc();if(NET.role==='host'&&NET.code){await roomPut(NET.code);roomHB(true);}};}
{const _hj=handleJoin;handleJoin=function(snap){if(snap.exists&&NET.role==='host'&&NET.code){roomDel(NET.code);roomHB(false);}return _hj(snap);};}
{const _lv=leaveNet;leaveNet=async function(msg){if(NET.role==='host'&&NET.code&&UI.screen==='lobby')await roomDel(NET.code);roomHB(false);return _lv(msg);};}
try{if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('beforeunload',()=>{if(NET.role==='host'&&NET.code&&UI.screen==='lobby')roomDel(NET.code);});}catch(e){}
async function roomJoin(code){try{const n=document.getElementById('nickin');if(n&&typeof n.value==='string')setNick(n.value.trim());}catch(e){}await guestJoin(code);if(NET.role==='guest')roomDel(code);}
onlineHTML=function(){
  if(NET.db===undefined)return `<div class="online"><b>オンライン対戦</b><p class="note">接続を確認しています…</p></div>`;
  if(!NET.db)return `<div class="online"><b>オンライン対戦</b><p class="warn">オンライン機能に接続できませんでした。${NET.err?esc(NET.err):''}</p></div>`;
  const blocked=NET.canWrite===false,dis=(blocked||NET.busy)?'disabled':'';
  const L=roomsOpen();
  const rows=L.length?L.map(([c,r])=>{const m=Math.max(0,Math.round((Date.now()-(r.t||0))/60000));return `<div class="rmrow"><div class="rmi"><b>${esc(r.name||'だれか')}さんの部屋</b><small>部屋番号 ${esc(c)}${r.deck?'・'+esc(r.deck):''}・${m<1?'いま':m+'分前'}</small></div><button class="primary" onclick="roomJoin('${esc(c)}')" ${dis}>入る</button></div>`;}).join(''):'<p class="note rmnone">いま、待っている部屋はありません。友だちに「部屋をつくる」を押してもらうと、ここに出てきます。</p>';
  return `<div class="online">
  <label class="nick">あなたの名前 <input id="nickin" maxlength="12" value="${esc(myNick())}" placeholder="例：りきや" autocomplete="off"></label>
  ${blocked?`<p class="warn">${esc(WRITE_MSG)}</p>`:''}${NET.busy?'<p class="note">部屋をつくっています…</p>':''}${NET.err?`<p class="warn">${esc(NET.err)}</p>`:''}
  <h3 class="rmh">待っている部屋 <small>押すだけで入れます</small></h3>
  <div class="rmlist">${rows}</div>
  <h3 class="rmh">自分で部屋をつくる</h3>
  <button class="big rmmake" data-do="host" ${dis}>＋ 部屋をつくる（あなたが先攻）</button>
  <details class="rmcode"><summary>部屋番号を入力して入る</summary><div class="join"><input id="codein" placeholder="部屋番号（5文字）" maxlength="8" autocomplete="off" autocapitalize="characters"><button data-do="join" ${dis}>入る</button></div></details>
  </div>`;
};
lobbyHTML=function(){
  return `<div class="title"><h1>対戦相手を待っています</h1><p class="sub">友だちの「友だちと対戦」画面に、<b>${esc(myNick()||'あなた')}さんの部屋</b>が出ています。<br>友だちはそれを押すだけで入れます。</p>
  <p class="note">部屋番号</p><div class="code">${esc(NET.code||'')}</div>
  ${NET.err?`<p class="warn">${esc(NET.err)}</p>`:''}
  <p class="note">入室すると自動で対戦が始まります。このページを閉じると、部屋はなくなります。</p>
  <button class="ghost" data-do="leave">やめる</button></div>`;
};
{let k=0;const iv=setInterval(()=>{k++;if(NET.db){roomsStart();clearInterval(iv);}else if(k>120||NET.db===null)clearInterval(iv);},500);}

/* ===== ハイパーモード（Zラッシュ・ハイパー化）の表示と処理 ===== */
function zrHas(x){const d=D(x);return !!(d&&d.hyper&&(d.txt||[]).some(t=>/^Zラッシュ/.test(t)));}
function zrRelease(pi){for(const x of G.p[pi].bz)if(zrHas(x)&&!x.hyper&&!ignored(x)){x.hyper=true;log(`Zラッシュ！ 『${nameOf(x)}』のハイパーモードが解放された`);}}
function zrUids(P){const s=[];for(const sh of P.shields){s.push(sh.uid);(sh.under||[]).forEach(u=>s.push(u.uid));}return s;}
function zrSnap(){if(!G||!G.p)return;G.shSnap=G.p.map(zrUids);}
/* どの効果でシールドが離れても、Zラッシュが働くように見張る */
function zrSweep(){
  if(!G||!G.p||G.over||NET.role==='guest')return;
  if(!G.shSnap){zrSnap();return;}
  G.p.forEach((P,q)=>{const now=new Set(zrUids(P));if((G.shSnap[q]||[]).some(u=>!now.has(u)))zrRelease(q);});
  zrSnap();
}
{const _r=render;render=function(){try{zrSweep();}catch(e){}return _r.apply(this,arguments);};}
/* ハイパーモード中の印と「ハイパー化できる」の印 */
{const _c=cardHTML;cardHTML=function(inst,o={}){
  let h=_c(inst,o);if(o.back||!inst||!G||!G.p)return h;
  try{
    const onBz=inst.owner!==undefined&&G.p[inst.owner]&&G.p[inst.owner].bz.includes(inst);
    if(!onBz)return h;
    if(inst.hyper&&D(inst).hyper)h=h.replace(/<\/div>$/,'<b class="hyb">ハイパー</b></div>');
    else if(inst.owner===ME&&G.cur===ME&&!G.busy&&D(inst).hyperize&&playOptions(ME,inst,'bz').some(op=>op.key==='hyperize'&&!op.why))h=h.replace('class="card ','class="card hzok ');
  }catch(e){}
  return h;};}
/* CPU：攻撃できないクリーチャーをタップに使えるときだけハイパー化する */
{const _w=cpuWants;cpuWants=function(pi,card,key,zone){
  if(key==='hyperize'){const n=D(card).hyperize===true?1:D(card).hyperize;const others=G.p[pi].bz.filter(y=>y!==card&&!y.tapped);const idle=others.filter(y=>!canAtk(y));return idle.length>=n||others.length>n+1;}
  return _w(pi,card,key,zone);};}

/* ===== オンライン対戦：途中で画面がかわっても、あとから対戦にもどれる ===== */
const RESUME_KEY='dm26resume',RESUME_TTL=6*60*60*1000;
const RES={busy:false,err:''};
function resGet(){try{const v=JSON.parse(localStorage.getItem(RESUME_KEY)||'null');if(v&&v.code&&Date.now()-(v.t||0)<RESUME_TTL)return v;}catch(e){}return null;}
function resSave(){try{if(NET.role&&NET.code)localStorage.setItem(RESUME_KEY,JSON.stringify({role:NET.role,code:NET.code,t:Date.now()}));}catch(e){}}
function resClear(){try{localStorage.removeItem(RESUME_KEY);}catch(e){}}
/* 盤面のJSONから、ホストの対戦データを元に戻す */
function resRestoreG(s){
  const g=JSON.parse(s);
  const base=freshG();
  for(const k in base)if(!(k in g))g[k]=base[k];
  g.fromDeck=new Set();g.gSnap=g.p.map(P=>new Set((P.grave||[]).map(x=>x.uid)));
  g.busy=false;g.wait=null;g.handEnterBusy=false;g.gwBusy=false;g.battling=null;
  let mx=0;const walk=o=>{if(!o||typeof o!=='object')return;if(Array.isArray(o)){o.forEach(walk);return;}if(typeof o.uid==='number'&&o.uid>mx)mx=o.uid;for(const k in o){const v=o[k];if(v&&typeof v==='object')walk(v);}};
  walk(g.p);if(UID<=mx)UID=mx+1;
  return g;
}
async function resumeGame(){
  const r=resGet();if(!r||!NET.db||RES.busy)return;
  RES.busy=true;RES.err='';render();
  try{
    const snap=await NET.db.doc(`games/${r.code}`).get();
    const d=snap.exists?snap.data():null;
    if(!d||d.phase==='closed'){resClear();RES.busy=false;RES.err='その対戦はもう終わっています';render();return;}
    if(d.phase!=='playing'||!d.s){RES.busy=false;RES.err='まだ対戦が始まっていません。もう一度部屋をつくってください。';resClear();render();return;}
    const er=e=>netErr(explainErr(e,'通信エラー'));
    resetNet();NET.code=r.code;
    if(r.role==='guest'){
      NET.role='guest';ME=1;
      /* まだ答えていない質問があれば、もう一度出す */
      const [ask,ans]=await Promise.all([gdoc('-ask').get(),gdoc('-ans').get()]);
      const a=ask.exists?ask.data():null,b=ans.exists?ans.data():null;
      NET.askInit=true;NET.lastAsk=(a&&a.pi===ME&&a.kind!=='cancel'&&(!b||b.seq!==a.seq))?null:(a?a.seq:null);
      G=JSON.parse(d.s);UI.screen='game';UI.sheet=null;UI.modal=null;UI.manaSel=null;UI.result=G.result||null;UI.resultHidden=false;
      NET.unsubs.push(gdoc().onSnapshot(onState,er),gdoc('-ask').onSnapshot(onAsk,er));
    }else{
      NET.role='host';ME=0;NET.askBase=Math.random().toString(36).slice(2,8);
      G=resRestoreG(d.s);NET.lastS=null;
      UI.screen='game';UI.sheet=null;UI.modal=null;UI.manaSel=null;UI.result=G.result||null;UI.resultHidden=false;
      if(!G.over)log('ホストが対戦にもどってきました');
      /* ゲストに出していた質問は取り消す（相手の画面を閉じる） */
      try{await gdoc('-ask').set({seq:`${NET.askBase}-cancel`,pi:1,kind:'cancel'});}catch(e){}
      NET.unsubs.push(gdoc('-act').onSnapshot(handleAct,er),gdoc('-ans').onSnapshot(handleAns,er));
    }
    resSave();RES.busy=false;render();
  }catch(e){RES.busy=false;RES.err=explainErr(e,'対戦にもどれませんでした');render();}
}
function resDrop(){const r=resGet();resClear();RES.err='';if(r&&r.role==='host'&&NET.db){try{NET.db.doc(`games/${r.code}`).set({phase:'closed',t:Date.now()});}catch(e){}}render();}
/* 相手側：取り消しの合図が来たら、出ている質問画面を閉じる */
{const _oa=onAsk;onAsk=function(snap){const d=snap.exists?snap.data():null;
  if(d&&d.kind==='cancel'&&NET.askInit){NET.lastAsk=d.seq;UI.modal=null;UI.manaSel=null;render();return;}
  return _oa(snap);};}
/* 対戦が始まったら、もどるための情報を保存。自分で「やめる」を押したら消す */
{const _sg=startGame;startGame=function(opt={}){const r=_sg(opt);if(opt.online)resSave();return r;};}
{const _os=onState;onState=function(snap){const r=_os(snap);if(NET.role==='guest'&&G)resSave();return r;};}
{const _lv=leaveNet;leaveNet=async function(msg){resClear();return _lv(msg);};}
/* アプリを切りかえて戻ってきたとき、最新の盤面を取り直す */
try{if(typeof document!=='undefined'&&document.addEventListener)document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!NET.db||!NET.code)return;
  try{if(NET.role==='guest'){const sn=await gdoc().get();onState(sn);}else if(NET.role==='host'&&G){NET.lastS=null;schedulePublish();}}catch(e){}
});}catch(e){}
/* メニューに「対戦にもどる」を出す */
function resumeBox(){
  const r=resGet();
  if(!r||NET.role)return RES.err?`<div class="rsbox"><p class="warn">${esc(RES.err)}</p></div>`:'';
  const ready=!!NET.db;
  return `<div class="rsbox"><b>対戦の途中です</b><p>部屋番号 ${esc(r.code)}（${r.role==='host'?'あなたが作った部屋':'友だちの部屋'}）の対戦にもどれます。</p>
    ${RES.err?`<p class="warn">${esc(RES.err)}</p>`:''}
    <div class="rsbtn"><button class="primary big" onclick="resumeGame()" ${ready&&!RES.busy?'':'disabled'}>${RES.busy?'もどっています…':ready?'▶ 対戦にもどる':'接続しています…'}</button>
    <button class="ghost" onclick="resDrop()">この対戦はやめる</button></div></div>`;
}
{const _t=titleHTML;titleHTML=function(){const h=_t();const b=resumeBox();if(!b)return h;return h.replace(/(<div class="title [^"]*">)/,'$1'+b);};}
/* 接続ができたらメニューを描き直す（ボタンを押せるように） */
{let k=0;const iv=setInterval(()=>{k++;if(NET.db||NET.db===null||k>120){clearInterval(iv);try{if(UI.screen==='title'&&!G&&resGet())render();}catch(e){}}},500);}

</script>
